name: Build

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'latest/**'
      - 'legacy/**'
      - .github/workflows/build.yml
      - versions.json
  workflow_dispatch:

env:
  DOCKERHUB_REPOSITORY: ${{ github.repository_owner }}/imagemagick
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
  SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
  SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.set-matrix.outputs.latest }}
      legacy: ${{ steps.set-matrix.outputs.legacy }}
      latest-fields-pending: ${{ steps.set-matrix.outputs.latest-fields-pending }}
      legacy-fields-pending: ${{ steps.set-matrix.outputs.legacy-fields-pending }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set matrix
        id: set-matrix
        run: |
          json="$(cat ./versions.json)"
          {
            echo "latest=$(jq -cM .latest <<< "$json")"
            echo "legacy=$(jq -cM .legacy <<< "$json")"
            echo "latest-fields-pending<<EOF"
            jq -r '.latest[] | "ImageMagick \(.version): Pending..."' <<< "$json"
            echo "EOF"
            echo "legacy-fields-pending<<EOF"
            jq -r '.legacy[] | "ImageMagick \(.version): Pending..."' <<< "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  legacy-build-notify:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    outputs:
      slack-timestamp: ${{ steps.slack.outputs.slack-timestamp }}
    steps:
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        id: slack
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / legacy-build> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields: |
            {STATUS}
            {REF}
            ${{ needs.prepare.outputs.legacy-fields-pending }}
          status: in-progress

  legacy-build:
    needs: [prepare, legacy-build-notify]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.legacy) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to private registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_HOST }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Build a Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: debian
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-legacy-${{ matrix.image.version }}-debian
          cache-to: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-legacy-${{ matrix.image.version }}-debian,mode=max
          context: .
          file: ./legacy/debian/Dockerfile
          labels: maintainer=victor@popkov.me
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: |
            ${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:legacy-${{ matrix.image.version }}-debian
      - name: Build an Alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: alpine
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-legacy-${{ matrix.image.version }}-alpine
          cache-to: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-legacy-${{ matrix.image.version }}-alpine,mode=max
          context: .
          file: ./legacy/alpine/Dockerfile
          labels: maintainer=victor@popkov.me
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: |
            ${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:legacy-${{ matrix.image.version }}-alpine
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ always() && needs.legacy-build-notify.outputs.slack-timestamp != '' }}
        continue-on-error: true
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / legacy-build> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields-mode: merge
          ignore-failures: true
          preserve-color: true
          fields: |
            ImageMagick ${{ matrix.image.version }}: ${{ job.status == 'success' && 'Success' || job.status == 'cancelled' && 'Cancelled' || job.status == 'skipped' && 'Skipped' || 'Failure' }}
          timestamp: ${{ needs.legacy-build-notify.outputs.slack-timestamp }}
      - name: Save Slack field outcome
        if: ${{ always() }}
        run: |
          case "${{ job.status }}" in
            success) value=Success ;;
            cancelled) value=Cancelled ;;
            skipped) value=Skipped ;;
            *) value=Failure ;;
          esac
          mkdir -p .slack-field
          printf 'ImageMagick %s: %s\n' \
            '${{ matrix.image.version }}' \
            "$value" > .slack-field/field.txt
      - name: Upload Slack field outcome
        if: ${{ always() && needs.legacy-build-notify.outputs.slack-timestamp != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-field-legacy-build-${{ matrix.image.version }}
          path: .slack-field/field.txt
          if-no-files-found: error
          retention-days: 1

  legacy-build-finalize:
    needs: [legacy-build-notify, legacy-build]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.legacy-build-notify.result == 'success' }}
    steps:
      - name: Download Slack field outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: slack-field-legacy-build-*
          path: slack-fields
      - name: Assemble Slack fields
        id: fields
        run: |
          {
            echo 'fields<<EOF'
            find slack-fields -type f -name field.txt | sort | while read -r f; do cat "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Finalize Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / legacy-build> job in {GITHUB_REF} by {GITHUB_ACTOR}
          color: ${{ needs.legacy-build.result == 'success' && '#24a943' || needs.legacy-build.result == 'cancelled' && '#1f242b' || '#cc1f2d' }}
          fields: |
            {STATUS}
            {REF}
            ${{ steps.fields.outputs.fields }}
          status: ${{ needs.legacy-build.result == 'success' && 'success' || needs.legacy-build.result == 'cancelled' && 'cancelled' || 'failure' }}
          timestamp: ${{ needs.legacy-build-notify.outputs.slack-timestamp }}

  latest-build-notify:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    outputs:
      slack-timestamp: ${{ steps.slack.outputs.slack-timestamp }}
    steps:
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        id: slack
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / latest-build> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields: |
            {STATUS}
            {REF}
            ${{ needs.prepare.outputs.latest-fields-pending }}
          status: in-progress

  latest-build:
    needs: [prepare, latest-build-notify]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.latest) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to private registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_HOST }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Build a Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: debian
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-${{ matrix.image.version }}-debian
          cache-to: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-${{ matrix.image.version }}-debian,mode=max
          context: .
          file: ./latest/debian/Dockerfile
          labels: maintainer=victor@popkov.me
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: |
            ${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:${{ matrix.image.version }}-debian
      - name: Build an Alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: alpine
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-${{ matrix.image.version }}-alpine
          cache-to: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-${{ matrix.image.version }}-alpine,mode=max
          context: .
          file: ./latest/alpine/Dockerfile
          labels: maintainer=victor@popkov.me
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: |
            ${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:${{ matrix.image.version }}-alpine
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ always() && needs.latest-build-notify.outputs.slack-timestamp != '' }}
        continue-on-error: true
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / latest-build> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields-mode: merge
          ignore-failures: true
          preserve-color: true
          fields: |
            ImageMagick ${{ matrix.image.version }}: ${{ job.status == 'success' && 'Success' || job.status == 'cancelled' && 'Cancelled' || job.status == 'skipped' && 'Skipped' || 'Failure' }}
          timestamp: ${{ needs.latest-build-notify.outputs.slack-timestamp }}
      - name: Save Slack field outcome
        if: ${{ always() }}
        run: |
          case "${{ job.status }}" in
            success) value=Success ;;
            cancelled) value=Cancelled ;;
            skipped) value=Skipped ;;
            *) value=Failure ;;
          esac
          mkdir -p .slack-field
          printf 'ImageMagick %s: %s\n' \
            '${{ matrix.image.version }}' \
            "$value" > .slack-field/field.txt
      - name: Upload Slack field outcome
        if: ${{ always() && needs.latest-build-notify.outputs.slack-timestamp != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-field-latest-build-${{ matrix.image.version }}
          path: .slack-field/field.txt
          if-no-files-found: error
          retention-days: 1

  latest-build-finalize:
    needs: [latest-build-notify, latest-build]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.latest-build-notify.result == 'success' }}
    steps:
      - name: Download Slack field outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: slack-field-latest-build-*
          path: slack-fields
      - name: Assemble Slack fields
        id: fields
        run: |
          {
            echo 'fields<<EOF'
            find slack-fields -type f -name field.txt | sort | while read -r f; do cat "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Finalize Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / latest-build> job in {GITHUB_REF} by {GITHUB_ACTOR}
          color: ${{ needs.latest-build.result == 'success' && '#24a943' || needs.latest-build.result == 'cancelled' && '#1f242b' || '#cc1f2d' }}
          fields: |
            {STATUS}
            {REF}
            ${{ steps.fields.outputs.fields }}
          status: ${{ needs.latest-build.result == 'success' && 'success' || needs.latest-build.result == 'cancelled' && 'cancelled' || 'failure' }}
          timestamp: ${{ needs.latest-build-notify.outputs.slack-timestamp }}

  legacy-push-notify:
    needs: [prepare, legacy-build]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    outputs:
      slack-timestamp: ${{ steps.slack.outputs.slack-timestamp }}
    steps:
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        id: slack
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / legacy-push> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields: |
            {STATUS}
            {REF}
            ${{ needs.prepare.outputs.legacy-fields-pending }}
          status: in-progress

  legacy-push:
    needs: [prepare, legacy-build, legacy-push-notify]
    runs-on: ubuntu-latest
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.legacy-build.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.legacy) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to private registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_HOST }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Prepare Docker meta for a Debian image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: debian-meta
        with:
          flavor: prefix=legacy-,onlatest=true
          images: |
            ${{ env.DOCKERHUB_REPOSITORY }}
            ghcr.io/${{ env.DOCKERHUB_REPOSITORY }}
          labels: maintainer=victor@popkov.me
          tags: |
            type=raw,value=${{ matrix.image.version }}-debian
            ${{ matrix.image.latest && 'type=raw,value=debian' || '' }}
      - name: Build a Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-legacy-${{ matrix.image.version }}-debian
          context: .
          file: ./legacy/debian/Dockerfile
          labels: ${{ steps.debian-meta.outputs.labels }}
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          provenance: false
          pull: true
          push: ${{ !env.ACT }}
          sbom: false
          tags: ${{ steps.debian-meta.outputs.tags }}
      - name: Prepare Docker meta for an Alpine image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: alpine-meta
        with:
          images: |
            ${{ env.DOCKERHUB_REPOSITORY }}
            ghcr.io/${{ env.DOCKERHUB_REPOSITORY }}
          flavor: |
            latest=${{ matrix.image.latest || 'false' }}
            prefix=legacy-,onlatest=true
          labels: maintainer=victor@popkov.me
          tags: |
            type=raw,value=${{ matrix.image.version }}-alpine
            type=raw,value=${{ matrix.image.version }}
            ${{ matrix.image.latest && 'type=raw,value=alpine' || '' }}
            ${{ matrix.image.latest && 'type=raw,prefix=,value=legacy' || '' }}
      - name: Build an Alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-legacy-${{ matrix.image.version }}-alpine
          context: .
          file: ./legacy/alpine/Dockerfile
          labels: ${{ steps.alpine-meta.outputs.labels }}
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          provenance: false
          pull: true
          push: ${{ !env.ACT }}
          sbom: false
          tags: ${{ steps.alpine-meta.outputs.tags }}
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ always() && needs.legacy-push-notify.outputs.slack-timestamp != '' }}
        continue-on-error: true
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / legacy-push> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields-mode: merge
          ignore-failures: true
          preserve-color: true
          fields: |
            ImageMagick ${{ matrix.image.version }}: ${{ job.status == 'success' && 'Success' || job.status == 'cancelled' && 'Cancelled' || job.status == 'skipped' && 'Skipped' || 'Failure' }}
          timestamp: ${{ needs.legacy-push-notify.outputs.slack-timestamp }}
      - name: Save Slack field outcome
        if: ${{ always() }}
        run: |
          case "${{ job.status }}" in
            success) value=Success ;;
            cancelled) value=Cancelled ;;
            skipped) value=Skipped ;;
            *) value=Failure ;;
          esac
          mkdir -p .slack-field
          printf 'ImageMagick %s: %s\n' \
            '${{ matrix.image.version }}' \
            "$value" > .slack-field/field.txt
      - name: Upload Slack field outcome
        if: ${{ always() && needs.legacy-push-notify.outputs.slack-timestamp != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-field-legacy-push-${{ matrix.image.version }}
          path: .slack-field/field.txt
          if-no-files-found: error
          retention-days: 1

  legacy-push-finalize:
    needs: [legacy-push-notify, legacy-push]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.legacy-push-notify.result == 'success' }}
    steps:
      - name: Download Slack field outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: slack-field-legacy-push-*
          path: slack-fields
      - name: Assemble Slack fields
        id: fields
        run: |
          {
            echo 'fields<<EOF'
            find slack-fields -type f -name field.txt | sort | while read -r f; do cat "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Finalize Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / legacy-push> job in {GITHUB_REF} by {GITHUB_ACTOR}
          color: ${{ needs.legacy-push.result == 'success' && '#24a943' || needs.legacy-push.result == 'cancelled' && '#1f242b' || '#cc1f2d' }}
          fields: |
            {STATUS}
            {REF}
            ${{ steps.fields.outputs.fields }}
          status: ${{ needs.legacy-push.result == 'success' && 'success' || needs.legacy-push.result == 'cancelled' && 'cancelled' || 'failure' }}
          timestamp: ${{ needs.legacy-push-notify.outputs.slack-timestamp }}

  latest-push-notify:
    needs: [prepare, latest-build, legacy-push]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    outputs:
      slack-timestamp: ${{ steps.slack.outputs.slack-timestamp }}
    steps:
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        id: slack
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / latest-push> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields: |
            {STATUS}
            {REF}
            ${{ needs.prepare.outputs.latest-fields-pending }}
          status: in-progress

  latest-push:
    needs: [prepare, latest-build, legacy-push, latest-push-notify]
    runs-on: ubuntu-latest
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.latest-build.result == 'success' && needs.legacy-push.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.latest) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to private registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_HOST }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Prepare Docker meta for a Debian image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: debian-meta
        with:
          images: |
            ${{ env.DOCKERHUB_REPOSITORY }}
            ghcr.io/${{ env.DOCKERHUB_REPOSITORY }}
          labels: maintainer=victor@popkov.me
          tags: |
            type=raw,value=${{ matrix.image.version }}-debian
            ${{ matrix.image.latest && 'type=raw,value=debian' || '' }}
      - name: Build a Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-${{ matrix.image.version }}-debian
          context: .
          file: ./latest/debian/Dockerfile
          labels: ${{ steps.debian-meta.outputs.labels }}
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          provenance: false
          pull: true
          push: ${{ !env.ACT }}
          sbom: false
          tags: ${{ steps.debian-meta.outputs.tags }}
      - name: Prepare Docker meta for an Alpine image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: alpine-meta
        with:
          images: |
            ${{ env.DOCKERHUB_REPOSITORY }}
            ghcr.io/${{ env.DOCKERHUB_REPOSITORY }}
          flavor: latest=${{ matrix.image.latest || 'false' }}
          labels: maintainer=victor@popkov.me
          tags: |
            type=raw,value=${{ matrix.image.version }}-alpine
            type=raw,value=${{ matrix.image.version }}
            ${{ matrix.image.latest && 'type=raw,value=alpine' || '' }}
      - name: Build an Alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          cache-from: type=registry,ref=${{ secrets.PRIVATE_REGISTRY_HOST }}/imagemagick:cache-${{ matrix.image.version }}-alpine
          context: .
          file: ./latest/alpine/Dockerfile
          labels: ${{ steps.alpine-meta.outputs.labels }}
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7
          provenance: false
          pull: true
          push: ${{ !env.ACT }}
          sbom: false
          tags: ${{ steps.alpine-meta.outputs.tags }}
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ always() && needs.latest-push-notify.outputs.slack-timestamp != '' }}
        continue-on-error: true
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / latest-push> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields-mode: merge
          ignore-failures: true
          preserve-color: true
          fields: |
            ImageMagick ${{ matrix.image.version }}: ${{ job.status == 'success' && 'Success' || job.status == 'cancelled' && 'Cancelled' || job.status == 'skipped' && 'Skipped' || 'Failure' }}
          timestamp: ${{ needs.latest-push-notify.outputs.slack-timestamp }}
      - name: Save Slack field outcome
        if: ${{ always() }}
        run: |
          case "${{ job.status }}" in
            success) value=Success ;;
            cancelled) value=Cancelled ;;
            skipped) value=Skipped ;;
            *) value=Failure ;;
          esac
          mkdir -p .slack-field
          printf 'ImageMagick %s: %s\n' \
            '${{ matrix.image.version }}' \
            "$value" > .slack-field/field.txt
      - name: Upload Slack field outcome
        if: ${{ always() && needs.latest-push-notify.outputs.slack-timestamp != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slack-field-latest-push-${{ matrix.image.version }}
          path: .slack-field/field.txt
          if-no-files-found: error
          retention-days: 1

  latest-push-finalize:
    needs: [latest-push-notify, latest-push]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.latest-push-notify.result == 'success' }}
    steps:
      - name: Download Slack field outcomes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: slack-field-latest-push-*
          path: slack-fields
      - name: Assemble Slack fields
        id: fields
        run: |
          {
            echo 'fields<<EOF'
            find slack-fields -type f -name field.txt | sort | while read -r f; do cat "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Finalize Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / latest-push> job in {GITHUB_REF} by {GITHUB_ACTOR}
          color: ${{ needs.latest-push.result == 'success' && '#24a943' || needs.latest-push.result == 'cancelled' && '#1f242b' || '#cc1f2d' }}
          fields: |
            {STATUS}
            {REF}
            ${{ steps.fields.outputs.fields }}
          status: ${{ needs.latest-push.result == 'success' && 'success' || needs.latest-push.result == 'cancelled' && 'cancelled' || 'failure' }}
          timestamp: ${{ needs.latest-push-notify.outputs.slack-timestamp }}
