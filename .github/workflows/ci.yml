name: CI

permissions:
  contents: read

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
  SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
  SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set matrix
        id: set-matrix
        run: |
          json="$(cat ./versions.json)"
          matrix="$(jq -cM '
            (
              [ .latest[] | { version: .version, family: "latest", latest: (.latest // false) } ]
              +
              [ .legacy[] | { version: .version, family: "legacy", latest: (.latest // false) } ]
            )
          ' <<< "$json")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for docker-related changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'latest/**'
              - 'legacy/**'
              - '.github/workflows/ci.yml'
              - versions.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        id: node
        with:
          node-version: 24.11.1
      - name: Send Slack notification
        uses: codedsolar/slack-action@59996e0967dce98cf0f76825cad94daa7e6d4936 # v1.4.0
        if: ${{ github.event_name != 'pull_request' }}
        id: slack
        with:
          fields: |
            {STATUS}
            {REF}
            Node.js: ${{ steps.node.outputs.node-version }}
            Hadolint issues: Checking...
            Prettier issues: Checking...
            ShellCheck issues: Checking...
          status: in-progress
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint using Prettier
        run: pnpm exec prettier --check . || true
      - name: Output Prettier results
        id: prettier
        run: echo "issues=$(pnpm exec prettier --list-different . | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Lint using Hadolint (latest Alpine)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        id: hadolint-latest-alpine
        with:
          dockerfile: ./latest/alpine/Dockerfile
          no-fail: true
      - name: Lint using Hadolint (latest Debian)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        id: hadolint-latest-debian
        with:
          dockerfile: ./latest/debian/Dockerfile
          no-fail: true
      - name: Lint using Hadolint (legacy Alpine)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        id: hadolint-legacy-alpine
        with:
          dockerfile: ./legacy/alpine/Dockerfile
          no-fail: true
      - name: Lint using Hadolint (legacy Debian)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        id: hadolint-legacy-debian
        with:
          dockerfile: ./legacy/debian/Dockerfile
          no-fail: true
      - name: Output Hadolint results
        id: hadolint
        run: |
          latest_alpine_issues="$(echo '${{ steps.hadolint-latest-alpine.outputs.results }}' | sed '/^$/d' | sed '$!N; /^\n$/D' | wc -l)"
          latest_debian_issues="$(echo '${{ steps.hadolint-latest-debian.outputs.results }}' | sed '/^$/d' | sed '$!N; /^\n$/D' | wc -l)"
          legacy_alpine_issues="$(echo '${{ steps.hadolint-legacy-alpine.outputs.results }}' | sed '/^$/d' | sed '$!N; /^\n$/D' | wc -l)"
          legacy_debian_issues="$(echo '${{ steps.hadolint-legacy-debian.outputs.results }}' | sed '/^$/d' | sed '$!N; /^\n$/D' | wc -l)"
          {
            echo "latest-alpine-issues=$latest_alpine_issues"
            echo "latest-debian-issues=$latest_debian_issues"
            echo "legacy-alpine-issues=$legacy_alpine_issues"
            echo "legacy-debian-issues=$legacy_debian_issues"
            echo "issues=$((latest_alpine_issues + latest_debian_issues + legacy_alpine_issues + legacy_debian_issues))"
          } >> "$GITHUB_OUTPUT"
      - name: Lint using ShellCheck
        run: pnpm lint:shellcheck || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Output ShellCheck results
        id: shellcheck
        run: echo "issues=$(pnpm exec shellcheck -f gcc bin/*.sh tests/tests.sh 2>&1 | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Check results
        run: |
          hadolint_latest_alpine_issues="${{ steps.hadolint.outputs.latest-alpine-issues }}"
          hadolint_latest_debian_issues="${{ steps.hadolint.outputs.latest-debian-issues }}"
          hadolint_legacy_alpine_issues="${{ steps.hadolint.outputs.legacy-alpine-issues }}"
          hadolint_legacy_debian_issues="${{ steps.hadolint.outputs.legacy-debian-issues }}"
          hadolint_issues="${{ steps.hadolint.outputs.issues }}"
          prettier_issues="${{ steps.prettier.outputs.issues }}"
          shellcheck_issues="${{ steps.shellcheck.outputs.issues }}"
          echo "Hadolint issues (latest Alpine): $hadolint_latest_alpine_issues"
          echo "Hadolint issues (latest Debian): $hadolint_latest_debian_issues"
          echo "Hadolint issues (legacy Alpine): $hadolint_legacy_alpine_issues"
          echo "Hadolint issues (legacy Debian): $hadolint_legacy_debian_issues"
          echo "Total Hadolint issues: $hadolint_issues"
          echo "Total Prettier issues: $prettier_issues"
          echo "Total ShellCheck issues: $shellcheck_issues"
          exit_code=1
          if [ "$prettier_issues" = '0' ] && [ "$hadolint_issues" = '0' ] && [ "$shellcheck_issues" = '0' ]; then
            exit_code=0
          fi
          exit "$exit_code"
      - name: Update Slack notification
        uses: codedsolar/slack-action@59996e0967dce98cf0f76825cad94daa7e6d4936 # v1.4.0
        if: ${{ github.event_name != 'pull_request' && always() }}
        with:
          fields: |
            {STATUS}
            {REF}
            Node.js: ${{ steps.node.outputs.node-version }}
            Hadolint issues: ${{ steps.hadolint.outputs.issues || 'Skipped' }}
            Prettier issues: ${{ steps.prettier.outputs.issues || 'Skipped' }}
            ShellCheck issues: ${{ steps.shellcheck.outputs.issues || 'Skipped' }}
          status: ${{ job.status }}
          timestamp: ${{ steps.slack.outputs.slack-timestamp }}

  build:
    needs: [changes, prepare]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true' }}
    strategy:
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Send Slack notification
        uses: codedsolar/slack-action@59996e0967dce98cf0f76825cad94daa7e6d4936 # v1.4.0
        if: ${{ github.event_name != 'pull_request' }}
        id: slack
        with:
          fields: |
            {STATUS}
            {REF}
            ImageMagick version: ${{ matrix.image.version }}
          status: in-progress
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build a Debian image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          context: .
          file: ./${{ matrix.image.family }}/debian/Dockerfile
          labels: maintainer=victor@popkov.me
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: |
            ${{ matrix.image.family }}-${{ matrix.image.version }}-debian
      - name: Build an Alpine image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: IMAGEMAGICK_VERSION=${{ matrix.image.version }}
          context: .
          file: ./${{ matrix.image.family }}/alpine/Dockerfile
          labels: maintainer=victor@popkov.me
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: |
            ${{ matrix.image.family }}-${{ matrix.image.version }}-alpine
      - name: Tag Alpine image
        if: ${{ matrix.image.latest }}
        run: docker tag ${{ matrix.image.family }}-${{ matrix.image.version }}-alpine ${{ matrix.image.family }}
      - name: Save Alpine image
        if: ${{ matrix.image.latest }}
        run: docker save -o ./ci-${{ matrix.image.family }}-alpine.tar ${{ matrix.image.family }}
      - name: Upload Alpine image
        if: ${{ matrix.image.latest }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-${{ matrix.image.family }}-alpine-${{ github.run_id }}
          path: ci-${{ matrix.image.family }}-alpine.tar
          retention-days: 1
      - name: Update Slack notification
        uses: codedsolar/slack-action@59996e0967dce98cf0f76825cad94daa7e6d4936 # v1.4.0
        if: ${{ github.event_name != 'pull_request' && always() }}
        with:
          fields: |
            {STATUS}
            {REF}
            ImageMagick version: ${{ matrix.image.version }}
          status: ${{ job.status }}
          timestamp: ${{ steps.slack.outputs.slack-timestamp }}

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download latest image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-latest-alpine-${{ github.run_id }}
      - name: Download legacy image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-legacy-alpine-${{ github.run_id }}
      - name: Load latest image
        run: docker load -i ci-latest-alpine.tar
      - name: Load legacy image
        run: docker load -i ci-legacy-alpine.tar
      - name: Send Slack notification
        uses: codedsolar/slack-action@59996e0967dce98cf0f76825cad94daa7e6d4936 # v1.4.0
        if: ${{ github.event_name != 'pull_request' }}
        id: slack
        with:
          fields: |
            {STATUS}
            {REF}
            Testing: Checking...
          status: in-progress
      - name: Run tests
        run: |
          # ImageMagick 7
          docker run --name test-latest \
            --user root \
            -v './tests:/tests:rw' \
            -w /tests/ \
            latest \
            /bin/sh -c './tests.sh'
          mkdir -p ./tests-latest-results/
          docker cp test-latest:/tests/result/. ./tests-latest-results/
          docker rm test-latest

          # ImageMagick 6
          docker run --name test-legacy \
            --user root \
            -v './tests:/tests:rw' \
            -w /tests/ \
            legacy \
            /bin/sh -c './tests.sh'
          mkdir -p ./tests-legacy-results/
          docker cp test-legacy:/tests/result/. ./tests-legacy-results/
          docker rm test-legacy
      - name: Upload latest test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: tests-latest-results-${{ github.run_id }}
          path: ./tests-latest-results
          retention-days: 7
      - name: Upload legacy test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: tests-legacy-results-${{ github.run_id }}
          path: ./tests-legacy-results
          retention-days: 7
      - name: Update Slack notification
        uses: codedsolar/slack-action@59996e0967dce98cf0f76825cad94daa7e6d4936 # v1.4.0
        if: ${{ github.event_name != 'pull_request' && always() }}
        with:
          fields: |
            {STATUS}
            {REF}
            Testing: Completed
          status: ${{ job.status }}
          timestamp: ${{ steps.slack.outputs.slack-timestamp }}
